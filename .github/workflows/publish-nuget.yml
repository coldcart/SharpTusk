name: Publish NuGet Package

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
          source-url: https://nuget.pkg.github.com/coldcart/index.json
      env:
          NUGET_AUTH_TOKEN: ${{secrets.PAT}}

    - name: Pack
      run: |
        cd src/Tusk/
        dotnet pack -c Release --property:PackageOutputPath=out
    
    - name: Push to NuGet
      run: dotnet nuget push src/Tusk/out/*.nupkg --skip-duplicate --no-symbols
